name: Lint Shell Scripts

on:
  pull_request:
    paths:
      - 'bin/**'
      - '.config/shell/**'
      - '.config/zsh/**'
      - '.profile'
      - '.bashrc'
      - '.bash_profile'
      - '.zprofile'

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './bin'
          ignore_names: '*.md'
          additional_files: '.config/shell/common-profile.sh .config/zsh/update-completions.sh'
          # Fail on real defects, leave info/style advisory -- the same posture
          # bin/lint-shell already takes by running shellcheck with `|| true`.
          #
          # Every info-level finding here is SC1091 "Not following:
          # lib/common.sh", raised because the scripts source it via a
          # SCRIPT_DIR computed at runtime. `shellcheck -x -P SCRIPTDIR`
          # resolves all of them, but action-shellcheck@2.0.0 declares an
          # `options` input and never uses it, so there is no way to pass
          # those flags at this version.
          severity: warning
